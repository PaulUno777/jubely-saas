<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jubelee Staff</title>
<link rel="icon" href="assets/app-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --cream:    #f6f4ef;
    --cream-2:  #efece5;
    --cream-3:  #e3ddd0;
    --cream-4:  #d6cebe;
    --ink:      #1a1814;
    --ink-2:    #3a352a;
    --ink-mut:  #6b6457;
    --ink-soft: #908871;
    --card:     #29261b;
    --card-2:   #1e1b13;
    --card-3:   #36321f;
    --line:     rgba(26,24,20,0.08);
    --line-d:   rgba(255,255,255,0.08);
    --gold:     #b8924a;
    --gold-2:   #d4ae6c;
    --gold-3:   #8a6e38;
    --gold-bg:  rgba(184,146,74,0.14);
    --green-d:  #1e3a2a;
    --green:    #2d7a4d;
    --green-2:  #5fa97a;
    --mint:     #dceadf;
    --mint-2:   #c5dccb;
    --red-bg:   #f3d8cb;
    --red:      #a23e1a;
    --rose:     #d97757;
  }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .serif { font-family: 'Instrument Serif', 'Times New Roman', serif; font-style: italic; }
  .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* phone shell */
  .pf {
    width: 380px; height: 820px;
    flex: none;
    background: var(--cream);
    border-radius: 44px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 0 0 1px rgba(26,24,20,0.06),
      0 24px 64px rgba(26,24,20,0.18),
      0 8px 20px rgba(26,24,20,0.10);
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
    isolation: isolate;
  }
  .pf-status {
    height: 38px;
    padding: 0 26px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    flex-shrink: 0;
  }
  .pf-status.dark { color: #f6f4ef; }
  .pf-status .right { display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .pf-screen {
    flex: 1; min-height: 0;
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .pf-scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 8px;
  }
  .pf-scroll::-webkit-scrollbar { width: 0; }

  /* tabbar */
  .tabbar {
    height: 78px;
    background: rgba(246,244,239,0.92);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-top: 0.5px solid rgba(26,24,20,0.08);
    display: grid; grid-template-columns: 1fr 1fr 88px 1fr 1fr;
    align-items: start;
    padding: 8px 12px 0;
    flex-shrink: 0;
    position: relative;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding-top: 8px;
    color: var(--ink-mut);
    font-size: 11px; font-weight: 500;
    cursor: pointer;
    transition: color .15s;
  }
  .tab[data-active="true"] { color: var(--ink); }
  .tab[data-active="true"] svg { color: var(--green-d); }
  .tab-fab {
    position: relative;
    width: 64px; height: 64px;
    margin: -14px auto 0;
    background: var(--card);
    color: var(--gold-2);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 0 0 4px var(--cream),
      0 12px 24px rgba(26,24,20,0.28),
      0 4px 8px rgba(26,24,20,0.16);
    cursor: pointer;
    transition: transform .12s ease;
  }
  .tab-fab:active { transform: scale(0.96); }
  .tab-fab-label {
    position: absolute; bottom: -22px; left: 0; right: 0;
    text-align: center; font-size: 11px; font-weight: 600; color: var(--ink);
  }

  /* generic chrome */
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 14px 20px; border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(0.985); }
  .btn-primary { background: var(--card); color: var(--cream); }
  .btn-primary[disabled] { opacity: 0.35; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: #fff; }
  .btn-mint { background: var(--mint); color: var(--green); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid rgba(26,24,20,0.12); }
  .btn-danger { background: var(--red-bg); color: var(--red); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
  }
  .pill-gold { background: var(--gold-bg); color: var(--gold-3); }
  .pill-green { background: var(--mint); color: var(--green); }
  .pill-dark { background: rgba(255,255,255,0.08); color: var(--gold-2); }
  .pill-cream { background: var(--cream-2); color: var(--ink-mut); }

  .card-dark {
    background: var(--card); color: var(--cream);
    border-radius: 22px; padding: 18px;
    position: relative; overflow: hidden;
  }
  .card-cream {
    background: var(--cream-2);
    border-radius: 22px; padding: 16px;
  }
  .card-outline {
    background: var(--cream);
    border: 1px solid rgba(26,24,20,0.08);
    border-radius: 22px; padding: 16px;
  }

  .label-tag {
    text-transform: uppercase;
    font-size: 10.5px; letter-spacing: 0.12em;
    font-weight: 600; color: var(--ink-mut);
  }
  .label-tag.dark { color: rgba(255,255,255,0.55); }

  /* keypad */
  .keypad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .keypad button {
    appearance: none; border: 0; cursor: pointer;
    background: var(--cream-2);
    border-radius: 16px;
    padding: 14px 0;
    font-size: 26px; font-weight: 500;
    color: var(--ink);
    transition: background .12s ease, transform .08s ease;
  }
  .keypad button:active { background: var(--cream-3); transform: scale(0.97); }
  .keypad button.muted { background: transparent; }
  .keypad button.muted:active { background: var(--cream-2); }

  /* scanner viewfinder */
  @keyframes scanLine {
    0% { transform: translateY(0); opacity: 0.95; }
    50% { opacity: 1; }
    100% { transform: translateY(180px); opacity: 0.4; }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.6); }
    60%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  .anim-fade-in { opacity: 1; }
  .anim-pop { opacity: 1; }

  /* canvas / layout */
  .canvas {
    min-height: 100vh;
    padding: 56px 48px 96px;
    display: flex; flex-direction: column; gap: 36px;
    align-items: stretch;
  }
  .canvas-head {
    display: flex; flex-direction: column; gap: 8px;
    max-width: 880px;
  }
  .canvas-eyebrow {
    text-transform: uppercase;
    font-size: 11px; letter-spacing: 0.16em;
    color: var(--ink-mut);
    font-weight: 600;
  }
  .canvas-title { font-size: 44px; line-height: 1.05; letter-spacing: -0.02em; color: var(--ink); margin: 0; }
  .canvas-title .accent { color: var(--gold-3); }
  .canvas-sub { font-size: 16px; color: var(--ink-mut); max-width: 620px; line-height: 1.5; }

  .stage {
    display: flex; gap: 32px; align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stage-col {
    display: flex; flex-direction: column; gap: 14px;
    align-items: center;
  }
  .stage-col-label {
    font-size: 12.5px; color: var(--ink-mut); font-weight: 500;
    text-align: center;
  }
  .stage-col-label b { color: var(--ink); font-weight: 600; }

  /* screen jumper */
  .jumper {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 8px;
    background: var(--cream-2);
    border-radius: 999px;
    align-self: center;
    border: 1px solid rgba(26,24,20,0.05);
  }
  .jumper button {
    appearance: none; border: 0; cursor: pointer;
    padding: 8px 14px;
    border-radius: 999px;
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    color: var(--ink-mut);
    background: transparent;
    transition: background .15s, color .15s;
  }
  .jumper button:hover { color: var(--ink); }
  .jumper button[data-active="true"] {
    background: var(--card); color: var(--cream);
  }

  .footer-note {
    text-align: center; color: var(--ink-mut); font-size: 13px;
    max-width: 640px; margin: 0 auto;
    line-height: 1.6;
  }
  .footer-note .mono { font-size: 11.5px; }

  /* nav top in screens */
  .scr-top {
    padding: 16px 20px 8px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .scr-back {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--cream-2); color: var(--ink); cursor: pointer;
    flex-shrink: 0;
  }
  .scr-back.dark { background: rgba(255,255,255,0.08); color: var(--cream); }
  .scr-title { font-size: 17px; font-weight: 600; color: var(--ink); }
  .scr-title.dark { color: var(--cream); }

  /* form input */
  .field {
    background: var(--cream-2);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .field label {
    font-size: 11px; font-weight: 600; color: var(--ink-mut);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .field input {
    background: transparent; border: 0; outline: 0;
    font-family: inherit; font-size: 16px; color: var(--ink);
    padding: 0; width: 100%;
  }
  .field input::placeholder { color: var(--ink-soft); }
  .field.focus { box-shadow: 0 0 0 2px var(--card) inset; }

  /* list rows */
  .row-client {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 0.5px solid rgba(26,24,20,0.08);
    cursor: pointer;
  }
  .row-client:last-child { border-bottom: 0; }
  .avatar {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--cream-2);
    color: var(--gold-3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .avatar.gold { background: var(--gold-bg); color: var(--gold-3); }
  .avatar.silver { background: #e8e6df; color: #6e6a5f; }
  .avatar.bronze { background: #efddc8; color: #87613a; }
  .avatar.green { background: var(--mint); color: var(--green); }
  .avatar.dark { background: var(--card); color: var(--gold-2); }

  /* hero summary card on home */
  .hero-summary { padding: 18px 20px 14px; }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stat {
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 10px 12px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat .num { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 24px; font-weight: 400; color: var(--cream); line-height: 1.1; letter-spacing: 0.01em; }
  .stat .num small { font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 400; margin-left: 2px; font-style: italic; }
  .stat .lbl { font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 600; }

  /* recent activity */
  .activity-row {
    display: flex; gap: 12px; padding: 12px 0;
    border-bottom: 0.5px solid rgba(26,24,20,0.06);
  }
  .activity-row:last-child { border-bottom: 0; }
  .activity-dot {
    width: 8px; height: 8px; border-radius: 50%;
    margin-top: 6px; flex-shrink: 0;
  }
  .activity-dot.award { background: var(--green); }
  .activity-dot.redeem { background: var(--gold); }
  .activity-dot.signup { background: var(--rose); }
  .activity-body { flex: 1; min-width: 0; }
  .activity-title { font-size: 14px; font-weight: 500; color: var(--ink); }
  .activity-meta { font-size: 12px; color: var(--ink-mut); margin-top: 2px; }
  .activity-amt { font-size: 14px; font-weight: 600; }
  .activity-amt.award { color: var(--green); }
  .activity-amt.redeem { color: var(--gold-3); }
  .activity-amt.signup { color: var(--ink); }

  /* tier bar */
  .tier-bar {
    height: 4px; background: rgba(255,255,255,0.1);
    border-radius: 99px; position: relative; overflow: hidden;
  }
  .tier-bar > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--gold-3), var(--gold-2));
    border-radius: 99px;
  }

  /* scan viewfinder */
  .vf {
    width: 240px; height: 240px;
    position: relative;
    margin: 0 auto;
  }
  .vf::before, .vf::after,
  .vf > i:nth-of-type(1), .vf > i:nth-of-type(2) {
    content: ''; position: absolute; width: 40px; height: 40px;
    border: 3px solid var(--gold-2);
  }
  .vf::before { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
  .vf::after  { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
  .vf > i:nth-of-type(1) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
  .vf > i:nth-of-type(2) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
  .vf-line {
    position: absolute; left: 12px; right: 12px; top: 18px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
    box-shadow: 0 0 12px var(--gold-2);
    animation: scanLine 1.6s ease-in-out infinite alternate;
  }
  .vf-ghost {
    position: absolute; inset: 24px;
    display: grid;
    grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr);
    gap: 4px;
    opacity: 0.22;
  }
  .vf-ghost i { background: rgba(255,255,255,0.85); border-radius: 2px; }

  /* lo-fi QR */
  .qr {
    width: 88px; height: 88px;
    background: #fff; padding: 8px;
    border-radius: 14px;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    gap: 1.5px;
  }
  .qr i { background: var(--card); }
  .qr i.b { background: transparent; }

  /* keyboard area */
  .kb-area { padding: 12px 16px 16px; background: var(--cream-2); border-top: 1px solid rgba(26,24,20,0.06); }
</style>
</head>
