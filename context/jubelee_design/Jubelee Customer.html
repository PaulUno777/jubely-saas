<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jubelee · Client</title>
<link rel="icon" href="assets/app-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --cream:    #f6f4ef;
    --cream-2:  #efece5;
    --cream-3:  #e3ddd0;
    --cream-4:  #d6cebe;
    --ink:      #1a1814;
    --ink-2:    #3a352a;
    --ink-mut:  #6b6457;
    --ink-soft: #908871;
    --card:     #29261b;
    --card-2:   #1e1b13;
    --card-3:   #36321f;
    --line:     rgba(26,24,20,0.08);
    --line-d:   rgba(255,255,255,0.08);
    --gold:     #b8924a;
    --gold-2:   #d4ae6c;
    --gold-3:   #8a6e38;
    --gold-bg:  rgba(184,146,74,0.14);
    --green-d:  #1e3a2a;
    --green:    #2d7a4d;
    --green-2:  #5fa97a;
    --mint:     #dceadf;
    --mint-2:   #c5dccb;
    --red-bg:   #f3d8cb;
    --red:      #a23e1a;
    --rose:     #d97757;
    --map-water: #d8e3da;
    --map-park:  #dfe6d4;
    --map-road:  #e8e4d8;
    --map-block: #ece8db;
  }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh; overflow-x: hidden;
  }
  .serif { font-family: 'Instrument Serif', 'Times New Roman', serif; font-style: italic; }
  .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* phone shell */
  .pf {
    width: 380px; height: 820px; flex: none;
    background: var(--cream);
    border-radius: 44px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 0 0 1px rgba(26,24,20,0.06),
      0 24px 64px rgba(26,24,20,0.18),
      0 8px 20px rgba(26,24,20,0.10);
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
    isolation: isolate;
  }
  .pf-status {
    height: 38px; padding: 0 26px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    flex-shrink: 0;
  }
  .pf-status.dark { color: #f6f4ef; }
  .pf-status .right { display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .pf-screen { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .pf-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  .pf-scroll::-webkit-scrollbar { width: 0; }

  /* tabbar (customer 5-tab w/ center scan FAB) */
  .ctabbar {
    height: 78px;
    background: rgba(246,244,239,0.92);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-top: 0.5px solid rgba(26,24,20,0.08);
    display: grid; grid-template-columns: 1fr 1fr 88px 1fr 1fr;
    align-items: start;
    padding: 8px 12px 0;
    flex-shrink: 0;
  }
  .ctab {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding-top: 8px;
    color: var(--ink-mut);
    font-size: 11px; font-weight: 500;
    cursor: pointer;
    transition: color .15s;
  }
  .ctab[data-active="true"] { color: var(--ink); }
  .ctab[data-active="true"] svg { color: var(--green-d); }
  .ctab-fab {
    position: relative;
    width: 64px; height: 64px;
    margin: -14px auto 0;
    background: var(--card);
    color: var(--gold-2);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 0 0 4px var(--cream),
      0 12px 24px rgba(26,24,20,0.28),
      0 4px 8px rgba(26,24,20,0.16);
    cursor: pointer;
  }
  .ctab-fab-label {
    position: absolute; bottom: -22px; left: 0; right: 0;
    text-align: center; font-size: 11px; font-weight: 600; color: var(--ink);
  }

  /* ── generic chrome ─────────────────────────── */
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 14px 20px; border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(0.985); }
  .btn-primary { background: var(--card); color: var(--cream); }
  .btn-primary[disabled] { opacity: 0.35; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: #fff; }
  .btn-mint { background: var(--mint); color: var(--green); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid rgba(26,24,20,0.12); }
  .btn-outline { background: var(--cream); color: var(--ink); border: 1px solid rgba(26,24,20,0.16); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
  }
  .pill-gold { background: var(--gold-bg); color: var(--gold-3); }
  .pill-green { background: var(--mint); color: var(--green); }
  .pill-dark { background: rgba(255,255,255,0.08); color: var(--gold-2); }
  .pill-cream { background: var(--cream-2); color: var(--ink-mut); }
  .pill-sponsored {
    background: rgba(217,119,87,0.12); color: #b85a39;
  }

  .card-dark { background: var(--card); color: var(--cream); border-radius: 22px; padding: 18px; position: relative; overflow: hidden; }
  .card-cream { background: var(--cream-2); border-radius: 22px; padding: 16px; }
  .card-outline { background: var(--cream); border: 1px solid rgba(26,24,20,0.08); border-radius: 22px; padding: 16px; }

  .label-tag {
    text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.14em;
    font-weight: 600; color: var(--ink-mut);
  }
  .label-tag.dark { color: rgba(255,255,255,0.55); }

  /* ── animations ─────────────────────────────── */
  @keyframes pulseDot {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  @keyframes scanLine {
    0% { transform: translateY(0); opacity: 0.95; }
    50% { opacity: 1; }
    100% { transform: translateY(180px); opacity: 0.4; }
  }
  @keyframes pinDrop {
    0% { transform: translate(-50%, -100%) translateY(-12px); opacity: 0; }
    60% { transform: translate(-50%, -100%) translateY(2px); opacity: 1; }
    100% { transform: translate(-50%, -100%) translateY(0); opacity: 1; }
  }
  @keyframes ripple {
    0% { transform: scale(0.6); opacity: 0.6; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* ── canvas / layout ─────────────────────────── */
  .canvas { min-height: 100vh; padding: 56px 48px 96px; display: flex; flex-direction: column; gap: 36px; align-items: stretch; }
  .canvas-head { display: flex; flex-direction: column; gap: 8px; max-width: 880px; }
  .canvas-eyebrow { text-transform: uppercase; font-size: 11px; letter-spacing: 0.16em; color: var(--ink-mut); font-weight: 600; }
  .canvas-title { font-size: 44px; line-height: 1.05; letter-spacing: -0.02em; color: var(--ink); margin: 0; }
  .canvas-title .accent { color: var(--gold-3); }
  .canvas-sub { font-size: 16px; color: var(--ink-mut); max-width: 620px; line-height: 1.5; }

  .stage { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .stage-col { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .stage-col-label { font-size: 12.5px; color: var(--ink-mut); font-weight: 500; text-align: center; max-width: 380px; }
  .stage-col-label b { color: var(--ink); font-weight: 600; }

  .jumper {
    display: flex; gap: 6px; flex-wrap: wrap; padding: 8px;
    background: var(--cream-2); border-radius: 999px;
    align-self: center; border: 1px solid rgba(26,24,20,0.05);
  }
  .jumper button {
    appearance: none; border: 0; cursor: pointer;
    padding: 8px 14px; border-radius: 999px;
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    color: var(--ink-mut); background: transparent;
    transition: background .15s, color .15s;
  }
  .jumper button:hover { color: var(--ink); }
  .jumper button[data-active="true"] { background: var(--card); color: var(--cream); }
  .footer-note { text-align: center; color: var(--ink-mut); font-size: 13px; max-width: 640px; margin: 0 auto; line-height: 1.6; }
  .footer-note .mono { font-size: 11.5px; }

  /* ── form / field ──────────────────────────── */
  .field {
    background: var(--cream-2); border-radius: 14px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .field label {
    font-size: 11px; font-weight: 600; color: var(--ink-mut);
    letter-spacing: 0.06em; text-transform: uppercase;
  }

  /* ── avatar tones ──────────────────────────── */
  .avatar { width: 40px; height: 40px; border-radius: 12px; background: var(--cream-2); color: var(--gold-3);
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
  .avatar.gold { background: var(--gold-bg); color: var(--gold-3); }
  .avatar.silver { background: #e8e6df; color: #6e6a5f; }
  .avatar.bronze { background: #efddc8; color: #87613a; }
  .avatar.green { background: var(--mint); color: var(--green); }
  .avatar.dark { background: var(--card); color: var(--gold-2); }
  .avatar.rose { background: #f4d8cb; color: #b85a39; }
  .avatar.olive { background: #e2e3c9; color: #5d6627; }
  .avatar.blue { background: #d6e0e8; color: #3c5468; }

  /* ── tier bar ───────────────────────────── */
  .tier-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 99px; position: relative; overflow: hidden; }
  .tier-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-3), var(--gold-2)); border-radius: 99px; }
  .tier-bar.light { background: rgba(26,24,20,0.08); }

  /* ── scanner viewfinder ──────────────────────── */
  .vf { width: 240px; height: 240px; position: relative; margin: 0 auto; }
  .vf::before, .vf::after, .vf > i:nth-of-type(1), .vf > i:nth-of-type(2) {
    content: ''; position: absolute; width: 40px; height: 40px;
    border: 3px solid var(--gold-2);
  }
  .vf::before { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
  .vf::after  { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
  .vf > i:nth-of-type(1) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
  .vf > i:nth-of-type(2) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
  .vf-line {
    position: absolute; left: 12px; right: 12px; top: 18px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
    box-shadow: 0 0 12px var(--gold-2);
    animation: scanLine 1.6s ease-in-out infinite alternate;
  }
  .vf-ghost { position: absolute; inset: 24px; display: grid;
    grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr); gap: 4px; opacity: 0.22; }
  .vf-ghost i { background: rgba(255,255,255,0.85); border-radius: 2px; }

  /* ── map ────────────────────────────────── */
  .map-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(216,227,218,0.6), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(223,230,212,0.5), transparent 55%),
      var(--cream-2);
  }
  .map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-pin {
    position: absolute;
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
    cursor: pointer;
    transform: translate(-50%, -100%);
  }
  .map-pin .head {
    width: 36px; height: 36px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 8px rgba(26,24,20,0.25);
    border: 2px solid #fff;
  }
  .map-pin .head > * { transform: rotate(45deg); }
  .map-pin .shadow {
    width: 14px; height: 4px; border-radius: 50%;
    background: rgba(26,24,20,0.25);
    filter: blur(1px);
  }
  .map-pin.active .head { background: var(--gold); color: #fff; }
  .map-pin.inactive .head { background: var(--card); color: var(--gold-2); }
  .map-pin.suggested .head { background: var(--rose); color: #fff; }
  .map-pin .badge {
    position: absolute; top: -10px; right: -16px;
    background: var(--card); color: var(--gold-2);
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em;
    padding: 2px 6px; border-radius: 999px;
    border: 1.5px solid var(--cream);
    white-space: nowrap;
  }
  .me-dot {
    position: absolute; transform: translate(-50%, -50%);
    width: 14px; height: 14px; border-radius: 50%;
    background: #2a6fdb; border: 3px solid #fff;
    box-shadow: 0 0 0 8px rgba(42,111,219,0.15), 0 1px 3px rgba(26,24,20,0.3);
  }
  .me-dot::after {
    content: ''; position: absolute; inset: -10px;
    border-radius: 50%; border: 2px solid #2a6fdb;
    animation: ripple 2.2s ease-out infinite;
  }

  /* ── notification ────────────────────────── */
  .notif-banner {
    position: absolute; top: 8px; left: 12px; right: 12px;
    z-index: 20;
    background: rgba(41,38,27,0.95);
    color: var(--cream);
    border-radius: 18px;
    padding: 12px 14px;
    box-shadow: 0 12px 32px rgba(26,24,20,0.35), 0 0 0 1px rgba(255,255,255,0.06) inset;
    backdrop-filter: blur(20px);
    animation: slideDown .45s cubic-bezier(.2,.8,.2,1) both;
  }
  .lockscreen {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #1a1410 0%, #2b211a 60%, #3a2a1f 100%);
    overflow: hidden;
  }
  .lockscreen::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 0%, rgba(212,174,108,0.18), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(184,146,74,0.12), transparent 50%);
  }
  .lock-time {
    color: #fff; text-align: center;
    font-family: 'Instrument Serif', serif; font-style: italic;
    font-size: 92px; line-height: 1; font-weight: 400;
    letter-spacing: -0.02em;
  }
  .lock-date { color: rgba(255,255,255,0.7); text-align: center; font-size: 14px; margin-top: 6px; }
  .lock-notif {
    background: rgba(255,255,255,0.10);
    border-radius: 18px;
    padding: 14px;
    color: #fff;
    backdrop-filter: blur(24px);
    border: 0.5px solid rgba(255,255,255,0.10);
  }

  /* ── store hero ───────────────────────────── */
  .store-hero {
    height: 180px; border-radius: 22px;
    background: linear-gradient(135deg, var(--card) 0%, var(--card-3) 50%, var(--gold-3) 100%);
    position: relative; overflow: hidden;
  }
  .store-hero::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 80% 30%, rgba(212,174,108,0.3), transparent 40%),
      repeating-linear-gradient(135deg, transparent 0 14px, rgba(255,255,255,0.04) 14px 16px);
  }

  /* ── reward list rows (mirror customer wallet) ─── */
  .reward-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; border-radius: 18px;
    border: 1px solid var(--green);
    background: var(--mint);
  }
  .reward-row.locked {
    background: var(--cream-2);
    border-color: rgba(26,24,20,0.08);
  }
  .reward-row .ico {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--green); color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .reward-row.locked .ico { background: var(--cream-3); color: var(--ink-mut); }
  .reward-row .body { flex: 1; min-width: 0; }
  .reward-row .body .t { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .reward-row .body .s { font-size: 12px; color: var(--green); margin-top: 2px; }
  .reward-row.locked .body .s { color: var(--ink-mut); }
  .reward-row .cta {
    background: var(--cream); border: 1px solid rgba(26,24,20,0.16);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500;
    color: var(--ink); cursor: pointer;
    white-space: nowrap;
  }
  .reward-row.locked .cta { background: var(--cream-2); color: var(--ink-mut); cursor: default; }
</style>
</head>

  <template id="__bundler_thumbnail">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
