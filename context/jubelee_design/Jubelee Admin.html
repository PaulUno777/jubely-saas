<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jubelee · Admin</title>
<link rel="icon" href="assets/app-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Manrope:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Neutral Warm — surface, body, borders */
    --n0:#FDFAF5; --n1:#F5F0E8; --n2:#EAE3D8; --n3:#D8CFC2;
    --n4:#BDB3A3; --n5:#8E8472; --n6:#6B6155; --n7:#3D352A; --n8:#211C14;
    /* Emerald — actions, points, success */
    --e0:#E8F7EE; --e1:#A8DFC0; --e2:#1FA971; --e3:#0E7A52; --e4:#0A5038;
    /* Gold — paliers, rewards, logo accent */
    --g0:#FBF0D4; --g1:#F0D070; --g2:#C89B3C; --g3:#9A6E1A; --g4:#6B4510;
    /* Terracotta — human moments */
    --t0:#FBF0EB; --t1:#F0C4B0; --t2:#C26D52; --t3:#8A3D28;
    /* Teal — analytics, info */
    --tl0:#E8F4F4; --tl1:#90D0CC; --tl2:#0F766E; --tl3:#0A5450;
    /* Semantic */
    --bg:#FDFAF5;
    --surface:#FFFFFF;
    --surface-2:#F5F0E8;
    --border:rgba(33,28,20,0.08);
    --border-2:rgba(33,28,20,0.14);
    --body:#3D352A;
    --heading:#211C14;
    --muted:#6B6155;
    --soft:#8E8472;

    --shadow-card: 0 1px 0 rgba(33,28,20,0.04), 0 1px 2px rgba(33,28,20,0.04);
    --shadow-pop: 0 1px 0 rgba(33,28,20,0.04), 0 18px 40px rgba(33,28,20,0.10), 0 4px 12px rgba(33,28,20,0.06);
    --shadow-modal: 0 24px 80px rgba(33,28,20,0.22), 0 8px 24px rgba(33,28,20,0.10);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--body);
    font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .serif { font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-style: italic; font-weight: 500; }
  .mono  { font-family: 'DM Mono', ui-monospace, monospace; font-feature-settings: "tnum" 1; }

  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; }

  /* Page scaffold */
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* Stage wrapper — 1440 design width, scales down to fit */
  #stage-host {
    width: 100vw;
    min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    overflow-x: hidden;
    background: var(--bg);
  }
  #stage {
    width: 1440px;
    min-height: 1000px;
    transform-origin: top center;
    background: var(--bg);
  }

  /* SIDEBAR */
  .sidebar {
    width: 292px;
    background: #1A1610;
    color: #E8E2D5;
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(0,0,0,0.4);
  }
  .sb-rail {
    width: 60px; background: #14110B;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 20px 0 16px;
    flex: none;
  }
  .sb-main { flex: 1; padding: 22px 18px 18px; display: flex; flex-direction: column; min-height: 0; }

  .sb-logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--g2); color: #1A1610;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600;
    font-size: 22px;
  }
  .sb-rail-btn {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(232,226,213,0.45);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .sb-rail-btn:hover { background: rgba(255,255,255,0.04); color: rgba(232,226,213,0.85); }
  .sb-rail-btn[data-active="true"] { color: var(--g1); background: rgba(200,155,60,0.10); }

  .sb-store {
    padding: 14px 14px 16px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    margin-bottom: 22px;
    background: rgba(255,255,255,0.02);
  }
  .sb-store-row { display: flex; gap: 12px; align-items: center; }
  .sb-store-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(200,155,60,0.18); color: var(--g1);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 18px; font-weight: 500;
    flex: none;
  }
  .sb-store-name { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 19px; color: #F2EBDC; line-height: 1.1; }
  .sb-store-sub  { font-size: 11.5px; color: rgba(232,226,213,0.55); margin-top: 3px; letter-spacing: 0.01em; }
  .sb-plan {
    margin-top: 12px;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(168,223,192,0.12); color: #A8DFC0;
    padding: 4px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
  }

  .sb-section {
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(232,226,213,0.38); font-weight: 600;
    padding: 14px 10px 8px;
  }
  .sb-item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 11px;
    border-radius: 10px;
    color: rgba(232,226,213,0.72);
    font-size: 13.5px; font-weight: 500;
    cursor: pointer;
    transition: background .15s, color .15s;
    position: relative;
  }
  .sb-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-item:hover { background: rgba(255,255,255,0.04); color: #F2EBDC; }
  .sb-item[data-active="true"] {
    background: rgba(255,255,255,0.06);
    color: #F2EBDC;
  }
  .sb-item[data-active="true"]::before {
    content: ''; position: absolute; left: -18px; top: 8px; bottom: 8px; width: 2px;
    background: var(--g1); border-radius: 2px;
  }
  .sb-item svg { flex: none; opacity: 0.75; }
  .sb-item[data-active="true"] svg { opacity: 1; color: var(--g1); }
  .sb-item .count {
    margin-left: auto;
    font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,0.06); color: rgba(232,226,213,0.7);
    padding: 2px 7px; border-radius: 999px;
    min-width: 22px; text-align: center;
  }
  .sb-item .count.alert { background: rgba(194,109,82,0.22); color: #F0C4B0; }

  .sb-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 10px;
  }
  .sb-foot-avatar {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(200,155,60,0.18); color: var(--g1);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    flex: none;
  }
  .sb-foot-name { font-size: 13.5px; font-weight: 600; color: #F2EBDC; }
  .sb-foot-sub  { font-size: 11.5px; color: rgba(232,226,213,0.55); margin-top: 1px; }
  .sb-foot-stats { display: flex; gap: 16px; padding-top: 12px; }
  .sb-foot-stat .num { font-family: 'DM Mono', monospace; font-size: 15px; color: #F2EBDC; font-weight: 500; }
  .sb-foot-stat .lbl { font-size: 10px; color: rgba(232,226,213,0.5); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

  /* MAIN */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

  .topbar {
    height: 64px; padding: 0 28px;
    display: flex; align-items: center; gap: 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky; top: 0; z-index: 5;
  }
  .crumb {
    display: flex; align-items: baseline; gap: 10px;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: 26px; color: var(--heading); letter-spacing: -0.005em;
    white-space: nowrap;
  }
  .crumb-meta {
    font-family: 'Manrope', sans-serif; font-style: normal;
    font-size: 13px; color: var(--muted); font-weight: 400;
  }
  .crumb-meta::before { content: '·'; margin-right: 10px; color: var(--n4); }
  .topbar .grow { flex: 1; }
  .search {
    width: 320px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--muted);
  }
  .search input { flex: 1; background: transparent; border: 0; outline: 0; font-size: 13px; }
  .search kbd {
    font-family: 'DM Mono', monospace; font-size: 10.5px;
    background: var(--surface); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 5px; color: var(--muted);
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--body); cursor: pointer;
    position: relative;
    transition: background .12s, border-color .12s;
  }
  .icon-btn:hover { background: var(--n2); }
  .icon-btn .dot {
    position: absolute; top: 7px; right: 7px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--e2);
    box-shadow: 0 0 0 2px var(--bg);
  }

  /* BUTTONS */
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600;
    padding: 9px 14px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background .12s ease, transform .08s ease, border-color .12s;
    line-height: 1.2;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(0.5px); }
  .btn-primary { background: var(--e2); color: #fff; }
  .btn-primary:hover { background: var(--e3); }
  .btn-dark { background: var(--n8); color: var(--n0); }
  .btn-dark:hover { background: #000; }
  .btn-gold { background: var(--g0); color: var(--g4); border: 1px solid var(--g1); }
  .btn-gold:hover { background: var(--g1); }
  .btn-ghost { background: var(--surface); color: var(--body); border: 1px solid var(--border-2); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-soft { background: var(--surface-2); color: var(--body); }
  .btn-soft:hover { background: var(--n2); }
  .btn-danger { background: var(--t0); color: var(--t3); border: 1px solid var(--t1); }
  .btn-danger:hover { background: var(--t1); }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn-lg { padding: 12px 18px; font-size: 14px; border-radius: 12px; }

  /* PILLS */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.005em;
    white-space: nowrap;
  }
  .pill-emerald { background: var(--e0); color: var(--e4); }
  .pill-gold    { background: var(--g0); color: var(--g4); }
  .pill-terra   { background: var(--t0); color: var(--t3); }
  .pill-teal    { background: var(--tl0); color: var(--tl3); }
  .pill-neutral { background: var(--surface-2); color: var(--muted); }
  .pill-dot::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: 0.8;
  }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-card);
  }
  .card-head {
    padding: 16px 20px 12px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .card-head h3 {
    margin: 0; font-size: 14.5px; font-weight: 600; color: var(--heading);
    letter-spacing: -0.005em;
  }
  .card-head .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card-head .grow { flex: 1; }
  .card-body { padding: 4px 20px 18px; }

  /* KPI tiles */
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    position: relative;
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .kpi-label {
    font-size: 10.5px; letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .kpi-value {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: 36px; line-height: 1.05; color: var(--heading);
    letter-spacing: -0.01em;
    margin-top: 10px;
  }
  .kpi-value small { font-size: 17px; color: var(--muted); margin-left: 2px; font-style: italic; }
  .kpi-delta {
    margin-top: 6px;
    font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .kpi-delta.up { color: var(--e3); }
  .kpi-delta.down { color: var(--t3); }
  .kpi-spark { position: absolute; right: 12px; bottom: 10px; }
  .kpi-bar-left { position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; }

  /* TABLE */
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl thead th {
    font-size: 10.5px; letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
    text-align: left; padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tbl tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--body); vertical-align: middle;
    white-space: nowrap;
  }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl tbody tr:hover td { background: var(--n1); }

  /* AVATARS */
  .ava {
    width: 32px; height: 32px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
    flex: none;
  }
  .ava-em { background: var(--e0); color: var(--e4); }
  .ava-gd { background: var(--g0); color: var(--g4); }
  .ava-tr { background: var(--t0); color: var(--t3); }
  .ava-tl { background: var(--tl0); color: var(--tl3); }
  .ava-nu { background: var(--surface-2); color: var(--n6); }

  /* Tier dots */
  .tier-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
  .tier-bronze { background: #B07A4A; }
  .tier-silver { background: #9AA0A6; }
  .tier-or     { background: var(--g2); }
  .tier-plat   { background: var(--tl2); }

  /* SWITCH */
  .switch {
    width: 36px; height: 20px; border-radius: 999px;
    background: var(--n3); position: relative;
    cursor: pointer; transition: background .15s;
    flex: none;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: left .15s, transform .15s;
    box-shadow: 0 1px 2px rgba(33,28,20,0.18);
  }
  .switch[data-on="true"] { background: var(--e2); }
  .switch[data-on="true"]::after { left: 18px; }

  /* DRAG HANDLE */
  .drag {
    width: 14px; color: var(--n4);
    cursor: grab;
    display: inline-flex; flex-direction: column; gap: 2px; align-items: center;
  }
  .drag i { display: block; width: 3px; height: 3px; border-radius: 50%; background: currentColor; }

  /* FORM */
  .input, .select, .textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13.5px; color: var(--heading);
    outline: 0;
    transition: border-color .12s, background .12s;
  }
  .input:focus, .select:focus, .textarea:focus {
    border-color: var(--e2);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(31,169,113,0.10);
  }
  .input::placeholder { color: var(--n4); }
  .lbl {
    display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field-help { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.4; }

  /* TABS */
  .tabs {
    display: flex; align-items: center; gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 4px;
    margin-right: 18px;
    font-size: 13px; font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .12s, border-color .12s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: var(--heading); }
  .tab[data-active="true"] { color: var(--heading); border-bottom-color: var(--e2); font-weight: 600; }
  .tab .tab-count {
    font-size: 11px; padding: 1px 6px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); font-weight: 600;
  }
  .tab[data-active="true"] .tab-count { background: var(--e0); color: var(--e4); }

  /* TOAST */
  .toast-stack {
    position: fixed; bottom: 24px; right: 24px;
    display: flex; flex-direction: column; gap: 10px;
    z-index: 100;
  }
  .toast {
    background: var(--n8); color: var(--n0);
    border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: flex-start; gap: 10px;
    min-width: 320px; max-width: 380px;
    box-shadow: var(--shadow-modal);
    animation: toastIn .3s ease-out;
  }
  @keyframes toastIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .toast-icon {
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .toast-icon.em { background: rgba(31,169,113,0.18); color: #A8DFC0; }
  .toast-icon.gd { background: rgba(200,155,60,0.18); color: var(--g1); }
  .toast-icon.tr { background: rgba(194,109,82,0.18); color: #F0C4B0; }
  .toast-title { font-size: 13.5px; font-weight: 600; color: var(--n0); }
  .toast-sub { font-size: 12px; color: rgba(253,250,245,0.6); margin-top: 2px; line-height: 1.4; }
  .toast-close {
    background: transparent; border: 0; color: rgba(253,250,245,0.5);
    cursor: pointer; padding: 2px; margin-left: auto;
  }
  .toast-close:hover { color: var(--n0); }

  /* MODAL */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(33,28,20,0.42);
    backdrop-filter: blur(4px);
    z-index: 60; display: flex; align-items: center; justify-content: center;
    padding: 40px;
    animation: fadeIn .18s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border-radius: 18px;
    box-shadow: var(--shadow-modal);
    max-width: 760px; width: 100%;
    max-height: calc(100vh - 80px);
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: modalIn .22s ease-out;
  }
  @keyframes modalIn {
    from { transform: translateY(20px) scale(0.98); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  .modal-head {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 14px;
  }
  .modal-head h2 {
    margin: 0;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: 24px; color: var(--heading);
    letter-spacing: -0.005em; line-height: 1.1;
  }
  .modal-head .sub { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
  .modal-foot {
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    background: var(--n1);
  }
  .modal-foot .grow { flex: 1; }

  /* MISC HELPERS */
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .grow { flex: 1; }
  .num { font-family: 'DM Mono', monospace; font-feature-settings: "tnum" 1; }

  /* Donut */
  .donut { width: 144px; height: 144px; }

  /* Empty state */
  .empty {
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--border-2);
    border-radius: 14px;
    background: var(--n1);
  }
  .empty-ico {
    width: 56px; height: 56px; border-radius: 16px;
    margin: 0 auto 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--n4);
  }

  /* Skeleton */
  @keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
  .skel {
    background: linear-gradient(90deg, var(--n1) 0%, var(--n2) 50%, var(--n1) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.6s linear infinite;
    border-radius: 6px;
  }

  /* QR — lo-fi */
  .qr-box {
    background: #1A1610; border-radius: 14px;
    padding: 18px;
    display: flex; align-items: center; gap: 18px;
  }
  .qr-grid {
    width: 96px; height: 96px;
    background: #fff; padding: 7px; border-radius: 10px;
    display: grid; gap: 1.5px;
    grid-template-columns: repeat(11, 1fr);
    grid-template-rows: repeat(11, 1fr);
    flex: none;
  }
  .qr-grid i { background: #1A1610; }
  .qr-grid i.b { background: transparent; }
  .qr-name { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 22px; color: #F2EBDC; }
  .qr-slug {
    margin-top: 8px;
    background: rgba(200,155,60,0.14); color: var(--g1);
    padding: 5px 9px; border-radius: 8px;
    font-family: 'DM Mono', monospace; font-size: 12px;
    display: inline-block;
  }
  .qr-actions { display: flex; gap: 8px; margin-top: 12px; }
  .qr-btn {
    background: rgba(200,155,60,0.20); color: var(--g1);
    border: 0; border-radius: 8px;
    padding: 6px 10px; font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  }
  .qr-btn:hover { background: rgba(200,155,60,0.30); }

  /* Activity feed */
  .feed-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .feed-row:last-child { border-bottom: 0; }
  .feed-title { font-size: 13.5px; font-weight: 500; color: var(--heading); line-height: 1.35; }
  .feed-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .feed-amt { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; margin-left: auto; flex: none; }

  /* Rule row */
  .rule-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    transition: border-color .12s, background .12s;
  }
  .rule-row:hover { border-color: var(--border-2); background: var(--n1); }
  .rule-row.disabled { opacity: 0.55; }
  .rule-rank {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--surface-2); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
    flex: none;
  }

  /* CHART helpers */
  .bar-grid { position: relative; }
  .bar-grid .axis-line {
    position: absolute; left: 0; right: 0; height: 1px;
    background: var(--border); pointer-events: none;
  }

  /* Resizing helper */
  .scaled-only { display: none; }

  /* Sparkline path classes */
  .spark-em { stroke: var(--e2); }
  .spark-gd { stroke: var(--g2); }
  .spark-tr { stroke: var(--t2); }
  .spark-tl { stroke: var(--tl2); }

  /* PRINT — isolate the QR enrollment fiche for PDF export */
  @media print {
    body { background: #fff !important; }
    #stage-host, #stage { transform: none !important; width: auto !important; height: auto !important; min-height: 0 !important; display: block !important; }
    .app > div { display: block !important; }
    .sidebar, .topbar, .toast-stack, .modal-backdrop { display: none !important; }
    body * { visibility: hidden; }
    #print-fiche, #print-fiche * { visibility: visible; }
    #print-fiche {
      position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
      width: 420px !important; box-shadow: none !important;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    @page { margin: 12mm; }
  }
</style>

</head>

  <div id="stage-host">
    <div id="stage">
      <div id="root">
        <div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#FDFAF5;">
          <div style="width:54px;height:54px;border-radius:16px;background:#C89B3C;color:#1A1610;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:30px;">J</div>
          <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#211C14;">Jubelee Admin</div>
          <div style="width:120px;height:3px;border-radius:3px;background:#EAE3D8;overflow:hidden;">
            <div style="width:40%;height:100%;background:#1FA971;border-radius:3px;animation:bootbar 1s ease-in-out infinite;"></div>
          </div>
          <div style="font-size:12px;color:#8E8472;">Chargement de votre espace…</div>
        </div>
      </div>
    </div>
  </div>
  <style>@keyframes bootbar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}</style>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#1A1610" rx="36"/>
      <g transform="translate(60 52)">
        <path d="M28 0 L36 22 L58 30 L36 38 L28 60 L20 38 L-2 30 L20 22 Z" fill="#C89B3C"/>
        <path d="M28 28 L36 28 L36 76 Q36 92 22 96 Q4 100 -4 84" stroke="#C89B3C" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
  </template>

  <script>
    // Scale 1440 stage into viewport width
    function fitStage() {
      const host = document.getElementById('stage-host');
      const stage = document.getElementById('stage');
      if (!host || !stage) return;
      const vw = host.clientWidth;
      const scale = Math.min(1, vw / 1440);
      stage.style.transform = `scale(${scale})`;
      // adjust host height so scaled content fits
      stage.style.width = '1440px';
      host.style.height = (stage.offsetHeight * scale) + 'px';
    }
    window.addEventListener('resize', fitStage);
    window.addEventListener('load', () => { setTimeout(fitStage, 30); setTimeout(fitStage, 300); });
    // observe stage size
    const ro = new ResizeObserver(fitStage);
    window.addEventListener('DOMContentLoaded', () => {
      const s = document.getElementById('stage');
      if (s) ro.observe(s);
    });
  </script>
